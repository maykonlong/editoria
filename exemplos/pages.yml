name: Publicar prévia do livro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Para lançamento, troque @main por uma tag ou SHA da ferramenta já testada.
      - name: Instalar Editoria
        run: python -m pip install 'git+https://github.com/maykonlong/editoria.git@main'
      - name: Gerar somente o site público
        run: editoria gerar . --somente publico
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/publico
      - id: deployment
        uses: actions/deploy-pages@v4
