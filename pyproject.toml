[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "editoria-livros"
version = "0.1.0"
description = "Fluxo editorial reproduzível para romances em português"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13", "reportlab>=4,<5", "pypdf>=5,<7"]

[project.scripts]
editoria = "editoria.cli:main"

[tool.setuptools.packages.find]
include = ["editoria*"]
